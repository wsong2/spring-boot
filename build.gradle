plugins {
	id 'org.springframework.boot' version '3.3.6'
	id 'io.spring.dependency-management' version '1.1.6'
	id 'java'
	id 'idea'
}

java {
	sourceCompatibility = '21'
}

repositories {
	mavenCentral()
}

configurations {
    compile.exclude module: "spring-boot-starter-tomcat"
}

def junitPlatformVersion = '1.10.3'

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-web' 
	implementation 'org.springframework.boot:spring-boot-starter-jetty'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6:3.1.2.RELEASE'
	implementation "org.junit.platform:junit-platform-commons:${junitPlatformVersion}"
	implementation files('libs/mssql-jdbc-12.6.1.jre11.jar')
}

test { 
	useJUnitPlatform()
	jvmArgs '-Xshare:off'
	jvmArgs '-XX:+EnableDynamicAgentLoading'
	dependencies {
		implementation 'org.springframework.boot:spring-boot-starter-test' 
		implementation 'org.junit.jupiter:junit-jupiter-api:5.10.3'
		implementation "org.junit.platform:junit-platform-engine:${junitPlatformVersion}"
	}
}
